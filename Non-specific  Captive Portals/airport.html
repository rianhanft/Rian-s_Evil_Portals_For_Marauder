<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#1a2332;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.top{width:100%;max-width:430px;background:#0d1520;border:1px solid #1e2d42;border-bottom:2px solid #2E86AB;border-radius:14px 14px 0 0;padding:18px 24px;display:flex;align-items:center;gap:14px}
.icon{width:40px;height:40px;background:rgba(46,134,171,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon svg{width:22px;height:22px;fill:#2E86AB}
.tname{font-size:14px;font-weight:700;color:#fff}.tsub{font-size:11px;color:#4a6080;margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}
.card{background:#0f1a28;width:100%;max-width:430px;border:1px solid #1e2d42;border-top:none;border-radius:0 0 14px 14px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.4)}
.cb{padding:26px 24px 22px}
.badge{display:flex;align-items:center;gap:10px;background:#0d1a28;border:1px solid #1e2d42;border-radius:8px;padding:10px 13px;margin-bottom:22px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,0.18)}
.badge span{font-size:12.5px;color:#4a6080}.badge strong{color:#c8d8e8;font-weight:600}
h2{font-size:18px;font-weight:700;color:#e8f0f8;margin-bottom:4px}
.subh{font-size:13px;color:#4a6080;margin-bottom:10px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#4a6080;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1px solid #1e2d42;border-radius:9px;font-size:15px;background:#131e2e;color:#e0eaf4}
input:focus{outline:none;border-color:#2E86AB;box-shadow:0 0 0 3px rgba(46,134,171,0.12)}
input::placeholder{color:#2a3d54}
.terms{font-size:11.5px;color:#4a6080;line-height:1.5;margin-top:14px;margin-bottom:6px}.terms a{color:#2E86AB}
.btn{width:100%;padding:13px;border:none;border-radius:9px;background:#2E86AB;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
.foot{background:#080f18;border-top:1px solid #1e2d42;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#2a3d54}.foot a{color:#2E86AB;text-decoration:none}
</style>
</head>
<body>
<div class="top">
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div>
  <div><div class="tname">International Airport</div><div class="tsub">Complimentary WiFi Service</div></div>
</div>
<div class="card">
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>Airport_FreeWiFi</strong></span></div>
    <h2>Connect to Free WiFi</h2><p class="subh">Complete the form below to access the internet.</p>
    <form action="/get">
      <label class="lbl">First Name</label>
      <input name="firstname" type="text" placeholder="Your first name" required>
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Flight Number (Optional)</label>
      <input name="flight" type="text" placeholder="e.g. UA2241">
      <p class="terms">By connecting you agree to the <a href="#">Acceptable Use Policy</a>.</p>
      <button type="submit" class="btn">Connect Now</button>
    </form>
  </div>
  <div class="foot"><span>Airport WiFi Services</span><a href="#">Help</a></div>
</div>
</body>
</html>
