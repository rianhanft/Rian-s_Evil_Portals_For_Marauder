<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.top{width:100%;max-width:420px;background:#1c2b4a;border-radius:14px 14px 0 0;padding:20px 24px;display:flex;align-items:center;gap:14px}
.icon{width:42px;height:42px;background:rgba(255,255,255,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon svg{width:22px;height:22px;fill:#fff}
.tname{font-size:15px;font-weight:700;color:#fff}.tsub{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}
.card{background:#fff;width:100%;max-width:420px;border-radius:0 0 14px 14px;box-shadow:0 12px 40px rgba(0,0,0,0.1);overflow:hidden}
.cb{padding:26px 24px 22px}
.badge{display:flex;align-items:center;gap:10px;background:#f0f4fb;border:1px solid #c7d5ea;border-radius:8px;padding:10px 13px;margin-bottom:22px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,0.2)}
.badge span{font-size:12.5px;color:#777}.badge strong{color:#1a1a1a;font-weight:600}
h2{font-size:18px;font-weight:700;color:#1c2b4a;margin-bottom:4px}
.subh{font-size:13px;color:#888;margin-bottom:10px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#1c2b4a;box-shadow:0 0 0 3px rgba(28,43,74,0.1)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11.5px;color:#aaa;line-height:1.5;margin-top:14px;margin-bottom:6px}.terms a{color:#1c2b4a}
.btn{width:100%;padding:13px;border:none;border-radius:9px;background:#1c2b4a;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
.foot{background:#f7f9fb;border-top:1px solid #eee;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#aaa}.foot a{color:#1c2b4a;text-decoration:none}
</style>
</head>
<body>
<div class="top">
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg></div>
  <div><div class="tname">Secure Guest Network</div><div class="tsub">WiFi Access Portal</div></div>
</div>
<div class="card">
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>SecureGuest-5G</strong></span></div>
    <h2>Guest Access</h2><p class="subh">Register your device to access the internet.</p>
    <form action="/get">
      <label class="lbl">Full Name</label>
      <input name="name" type="text" placeholder="Your full name" required>
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Phone Number (Optional)</label>
      <input name="phone" type="text" placeholder="(555) 000-0000" inputmode="tel">
      <p class="terms">By connecting you agree to the <a href="#">Acceptable Use Policy</a> and <a href="#">Privacy Notice</a>.</p>
      <button type="submit" class="btn">Register &amp; Connect</button>
    </form>
  </div>
  <div class="foot"><span>Network Guest Services</span><a href="#">Support</a></div>
</div>
</body>
</html>
