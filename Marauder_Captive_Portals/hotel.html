<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#1a1510;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.top{width:100%;max-width:420px;background:#1a1510;border:1px solid #3a2e22;border-bottom:2px solid #C9A96E;border-radius:14px 14px 0 0;padding:20px 24px}
.hname{font-size:18px;font-weight:800;color:#C9A96E;letter-spacing:2px;text-transform:uppercase}
.hsub{font-size:11px;color:#6a5a44;margin-top:3px;letter-spacing:1px;text-transform:uppercase}
.card{background:#201a12;width:100%;max-width:420px;border:1px solid #3a2e22;border-top:none;border-radius:0 0 14px 14px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.4)}
.cb{padding:26px 24px 22px}
.badge{display:flex;align-items:center;gap:10px;background:#181210;border:1px solid #3a2e22;border-radius:8px;padding:10px 13px;margin-bottom:22px}
.dot{width:8px;height:8px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.18)}
.badge span{font-size:12.5px;color:#6a5a44}.badge strong{color:#c8b898;font-weight:600}
h2{font-size:18px;font-weight:700;color:#C9A96E;letter-spacing:0.5px;margin-bottom:4px}
.subh{font-size:13px;color:#6a5a44;margin-bottom:10px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#6a5a44;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1px solid #3a2e22;border-radius:9px;font-size:15px;background:#181210;color:#e0d0b8}
input:focus{outline:none;border-color:#C9A96E;box-shadow:0 0 0 3px rgba(201,169,110,0.12)}
input::placeholder{color:#3a2e22}
.terms{font-size:11.5px;color:#6a5a44;line-height:1.5;margin-top:14px;margin-bottom:6px}.terms a{color:#C9A96E}
.btn{width:100%;padding:13px;border:none;border-radius:9px;background:#C9A96E;color:#1a1510;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px}
.foot{background:#181210;border-top:1px solid #3a2e22;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#3a2e22}.foot a{color:#C9A96E;text-decoration:none}
</style>
</head>
<body>
<div class="top"><div class="hname">The Grand Hotel</div><div class="hsub">Guest Internet Services</div></div>
<div class="card">
  <div class="cb">
    <div class="badge"><div class="dot"></div><span>Network: <strong>GrandHotel-Guest</strong></span></div>
    <h2>Complimentary WiFi</h2><p class="subh">Enter your reservation details to connect.</p>
    <form action="/get">
      <label class="lbl">Room Number</label>
      <input name="room" type="text" placeholder="e.g. 412" required inputmode="numeric">
      <label class="lbl">Last Name on Reservation</label>
      <input name="lastname" type="text" placeholder="As on your booking" required>
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com">
      <p class="terms">By connecting you agree to our <a href="#">Internet Use Policy</a>.</p>
      <button type="submit" class="btn">Connect to WiFi</button>
    </form>
  </div>
  <div class="foot"><span>Guest Internet Services</span><a href="#">Help Desk</a></div>
</div>
</body>
</html>
